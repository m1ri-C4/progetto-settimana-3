<!DOCTYPE html>
<html lang="it">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>MyRecipe</title>
    <link rel="stylesheet" href="./assets/css/style.css">
    <script src="./assets/js/script.js" defer></script>
    <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Material+Symbols+Outlined">
</head>

<body>

    <header>
        <button id="darkMode"> <span class="material-symbols-outlined"> dark_mode </span>Tema scuro </button>
        <button id="lightMode"> <span class="material-symbols-outlined"> light_mode </span>Tema chiaro</button>
        <h1> <span class="material-symbols-outlined"> chef_hat </span> MyRecipe </h1>
        <p> Il tuo ricettario personale </p>

    </header>

    <br>
    <main>
        <!-- form aggiungi ricetta-->
        <div class="card">
            <h2> Aggiungi una ricetta </h2>
            <form>
                <input type="text" id="nome" name="nome" placeholder="Nome ricetta" required>

                <select name="categoria" id="categoria">
                    <option value="">--Scegli la categoria--</option>
                    <option value="PR">Primo</option>
                    <option value="SC">Secondo</option>
                    <option value="HM">Hamburger</option>
                    <option value="DS">Dessert</option>
                </select>

                <select id="tempo_cottura" name="tempo_cottura">
                    <option value="">--Scegli il tempo di cottura--</option>
                    <option value="15">15 minuti</option>
                    <option value="30">30 minuti</option>
                    <option value="45">45 minuti</option>
                    <option value="60">1 ora</option>
                </select>

                <textarea id="procedimento" placeholder="Scrivi qui il procedimento della tua ricetta..."></textarea>

                <button type="submit" id="aggiungiBtn"> + Aggiungi ricetta </button>
            </form>
        </div>

        <br>

        <!-- ricerca della ricetta -->
        <div class="card">
            <input type="search" id="cerca" name="q" placeholder=" Cerca una ricetta...">
            <select id="filtraPer" name="filtraPer">
                <option value="TT">Tutti</option>
                <option value="AZ">Fatti</option>
                <option value="ZA">Preferiti</option>
            </select>
        </div>

        <br>

        <!-- card dei conteggi -->
        <div class="card">
            <section id="contatore"> </section>
            <div id="statistiche"></div>
            <div id="barra">
                <div id="progresso"> </div>
            </div>

        </div>

        <br>

        <!-- card delle ricette -->
        <div class="card">
            <h2>Le mie ricette</h2>
            <section id="listaRicette"> </section>
        </div>

    </main>

    <footer>

    </footer>

</body>

</html>
